<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bg-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f4ff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="highlight-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bg-gradient)" rx="20" ry="20" />
  
  <!-- Code brackets and symbols -->
  <g opacity="0.1">
    <text x="80" y="100" font-family="monospace" font-size="80" fill="#374151">{}</text>
    <text x="200" y="200" font-family="monospace" font-size="60" fill="#374151">&lt;/&gt;</text>
    <text x="600" y="150" font-family="monospace" font-size="70" fill="#374151">()</text>
    <text x="500" y="450" font-family="monospace" font-size="80" fill="#374151">[]</text>
    <text x="120" y="400" font-family="monospace" font-size="50" fill="#374151">==</text>
  </g>
  
  <!-- Developer figure -->
  <g transform="translate(400, 300)">
    <!-- Circle background -->
    <circle cx="0" cy="0" r="120" fill="url(#highlight-gradient)" opacity="0.9" />
    
    <!-- Computer/monitor -->
    <rect x="-70" y="-20" width="140" height="90" rx="5" ry="5" fill="#1e293b" />
    <rect x="-65" y="-15" width="130" height="80" rx="3" ry="3" fill="#0f172a" />
    
    <!-- Code on screen -->
    <g fill="#4ade80">
      <text x="-55" y="0" font-family="monospace" font-size="8">function develop() {</text>
      <text x="-55" y="15" font-family="monospace" font-size="8">  return solution;</text>
      <text x="-55" y="30" font-family="monospace" font-size="8">}</text>
      <text x="-55" y="45" font-family="monospace" font-size="8">// AI enhanced</text>
    </g>
    
    <!-- Monitor stand -->
    <rect x="-15" y="70" width="30" height="15" fill="#1e293b" />
    <rect x="-25" y="85" width="50" height="5" fill="#1e293b" />
    
    <!-- Brain/AI symbol -->
    <circle cx="90" cy="-60" r="35" fill="#f0f4ff" opacity="0.9" stroke="#6366f1" stroke-width="3" />
    <path d="M75,-70 C85,-85 95,-85 105,-70" stroke="#6366f1" stroke-width="2" fill="none" />
    <path d="M75,-50 C85,-35 95,-35 105,-50" stroke="#6366f1" stroke-width="2" fill="none" />
    <line x1="75" y1="-60" x2="105" y2="-60" stroke="#6366f1" stroke-width="2" />
    <line x1="90" y1="-85" x2="90" y2="-35" stroke="#6366f1" stroke-width="2" />
    
    <!-- Chess piece -->
    <g transform="translate(-90, -60)">
      <path d="M0,0 L10,-5 L10,-25 L5,-30 L15,-35 L5,-40 L15,-45 L0,-50 L-15,-45 L-5,-40 L-15,-35 L-5,-30 L-10,-25 L-10,-5 Z" fill="#334155" />
      <ellipse cx="0" cy="0" rx="15" ry="5" fill="#334155" />
    </g>
    
    <!-- Greek phi symbol for philosophy -->
    <text x="-90" y="60" font-family="serif" font-size="50" fill="#334155">φ</text>
  </g>
  
  <!-- Connected dots for networks -->
  <g stroke="#6366f1" stroke-width="1.5" fill="#6366f1">
    <circle cx="150" cy="100" r="3" />
    <circle cx="200" cy="150" r="3" />
    <circle cx="100" cy="200" r="3" />
    <circle cx="250" cy="100" r="3" />
    <circle cx="120" cy="130" r="3" />
    
    <line x1="150" y1="100" x2="200" y2="150" />
    <line x1="150" y1="100" x2="100" y2="200" />
    <line x1="150" y1="100" x2="250" y2="100" />
    <line x1="150" y1="100" x2="120" y2="130" />
    <line x1="120" y1="130" x2="100" y2="200" />
    <line x1="200" y1="150" x2="250" y2="100" />
    
    <circle cx="650" cy="500" r="3" />
    <circle cx="700" cy="450" r="3" />
    <circle cx="600" cy="400" r="3" />
    <circle cx="650" cy="400" r="3" />
    <circle cx="730" cy="500" r="3" />
    
    <line x1="650" y1="500" x2="700" y2="450" />
    <line x1="650" y1="500" x2="600" y2="400" />
    <line x1="650" y1="500" x2="650" y2="400" />
    <line x1="650" y1="500" x2="730" y2="500" />
    <line x1="700" y1="450" x2="650" y2="400" />
    <line x1="600" y1="400" x2="650" y2="400" />
  </g>
</svg>